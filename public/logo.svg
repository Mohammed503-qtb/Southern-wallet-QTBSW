<?xml version="1.0" encoding="utf-8"?>
<!-- ============================================================
  محفظة الجنوب — الشعار الرسمي المتفق عليه (شفاف خالص)
  الشعار الهندسي المتفق عليه من صورة المالك (IMG-20260911):
  مثلث علوي على خيط رابط، عمودان ومثلث مقلوب، معينان جانبيان،
  مثلث قائم مركزي بحدّ 45°، شبه منحرف ومستطيل سفليان،
  ومعين سفلي مائل — الهندسة مقاسة بكسل-ببكسل من الصورة الأصلية.
  ذهبي معدني على شفافية كاملة: لا خلفية إطلاقاً — يظهر الشعار فقط.
============================================================ -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512" width="512" height="512" role="img"
  aria-label="شعار محفظة الجنوب">
  <defs>
    <!-- التدرج الذهبي المعدني -->
    <linearGradient id="sw-gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0D98A"/>
      <stop offset="0.42" stop-color="#D9B43F"/>
      <stop offset="0.72" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8F7312"/>
    </linearGradient>
    <!-- لمعان علوي للعمق المعدني -->
    <linearGradient id="sw-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- الشعار: هندسة 104×100 مقاسة من الصورة الأصلية، موسّطة في 512 -->
  <g transform="translate(37.6 46) scale(4.2)">
    <!-- 1) المثلث العلوي ▲ -->
    <path fill="url(#sw-gold)" d="M52 0 L66.5 14.3 L37 14.3 Z"/>
    <!-- 2) الخيط الرابط الأفقي -->
    <rect fill="url(#sw-gold)" x="15.1" y="14.3" width="73.6" height="0.9"/>
    <!-- 3) العمود الأيسر -->
    <rect fill="url(#sw-gold)" x="15.1" y="15.2" width="21.2" height="20.5"/>
    <!-- 4) العمود الأيمن -->
    <rect fill="url(#sw-gold)" x="67.2" y="15.2" width="21.5" height="20.5"/>
    <!-- 5) المثلث المقلوب المركزي ▼ -->
    <path fill="url(#sw-gold)" d="M37 15.2 L66.5 15.2 L51.8 29.4 Z"/>
    <!-- 6) المعين الأيسر ◆ -->
    <path fill="url(#sw-gold)" d="M14.8 35.7 L29.4 50 L14.8 64.3 L0.2 50 Z"/>
    <!-- 7) المعين الأيمن ◆ -->
    <path fill="url(#sw-gold)" d="M88.9 35.7 L103.8 50 L88.9 64.3 L74.4 50 Z"/>
    <!-- 8) المثلث القائم المركزي (حد 45°) -->
    <path fill="url(#sw-gold)" d="M59.1 43.2 L59.1 64.3 L37.2 64.3 Z"/>
    <!-- 9) شبه المنحرف السفلي الأيسر -->
    <path fill="url(#sw-gold)" d="M15.1 64.3 L57.5 64.3 L37.4 84.5 L15.1 84.5 Z"/>
    <!-- 10) المستطيل السفلي الأيمن -->
    <rect fill="url(#sw-gold)" x="67.2" y="64.3" width="21.5" height="20.5"/>
    <!-- 11) المعين السفلي المائل ◆ -->
    <path fill="url(#sw-gold)" d="M55.3 74.7 L66.5 84.9 L51.8 99.8 L40.4 88.9 Z"/>

    <!-- لمعان علوي موحّد -->
    <g fill="url(#sw-sheen)">
      <path d="M52 0 L66.5 14.3 L37 14.3 Z"/>
      <rect x="15.1" y="14.3" width="73.6" height="0.9"/>
      <rect x="15.1" y="15.2" width="21.2" height="20.5"/>
      <rect x="67.2" y="15.2" width="21.5" height="20.5"/>
      <path d="M37 15.2 L66.5 15.2 L51.8 29.4 Z"/>
      <path d="M14.8 35.7 L29.4 50 L14.8 64.3 L0.2 50 Z"/>
      <path d="M88.9 35.7 L103.8 50 L88.9 64.3 L74.4 50 Z"/>
      <path d="M59.1 43.2 L59.1 64.3 L37.2 64.3 Z"/>
      <path d="M15.1 64.3 L57.5 64.3 L37.4 84.5 L15.1 84.5 Z"/>
      <rect x="67.2" y="64.3" width="21.5" height="20.5"/>
      <path d="M55.3 74.7 L66.5 84.9 L51.8 99.8 L40.4 88.9 Z"/>
    </g>
  </g>
</svg>
