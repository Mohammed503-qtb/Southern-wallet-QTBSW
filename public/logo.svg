<?xml version="1.0" encoding="utf-8"?>
<!-- ============================================================
  محفظة الجنوب — الشعار الرسمي (شفاف خالص)
  علامة الجنوب الثلاثية بتدرج ذهبي فاخر على شفافية كاملة:
  لا خلفية إطلاقاً — يظهر الشعار فقط، فيندمج مع أي سطح.
  عرض 512×512 (يُصغَّر لأي استخدام: أيقونات، شاشات، طباعة).
============================================================ -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512" width="512" height="512" role="img"
  aria-label="شعار محفظة الجنوب">
  <defs>
    <!-- التدرج الذهبي المركزي: أفتح في القلب، أعمق عند الأطراف -->
    <linearGradient id="sw-gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0D98A"/>
      <stop offset="0.42" stop-color="#D9B43F"/>
      <stop offset="0.72" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8F7312"/>
    </linearGradient>
    <!-- تدرج لمعان علوي للعمق -->
    <linearGradient id="sw-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- ظل ناعم جداً لرفع العلامة عن السطح الشفاف -->
    <filter id="sw-lift" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- العلامة: تحويل من شبكة 30 الأصلية إلى 512 مع توسيط (scale 14.4 + offset 40) -->
  <g filter="url(#sw-lift)">
    <g transform="translate(40 40) scale(14.4)">
      <!-- الشرطة العلوية: حافة الافتتاح -->
      <path fill="url(#sw-gold)" d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
      <!-- الشطراح القطري: جسد العلامة (ازدواجية الجنوب) -->
      <polygon fill="url(#sw-gold)" points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <!-- الشرطة السفلية: حافة الختام -->
      <path fill="url(#sw-gold)" d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>

      <!-- لمعان علوي يكرّس الحجم ثلاثي الأبعاد -->
      <g fill="url(#sw-sheen)">
        <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
        <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
        <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
      </g>
    </g>
  </g>
</svg>
